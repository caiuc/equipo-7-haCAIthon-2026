services:
  postgres:
    image: postgres:16
    container_name: medstock-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medstock
    volumes:
      - medstock_pgdata:/var/lib/postgresql/data

volumes:
  medstock_pgdata:
